<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XYF 测试网站</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #111827, #312e81, #0f766e);
      background-size: 300% 300%;
      animation: bg 12s ease infinite;
    }
    @keyframes bg {
      0%,100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .card {
      width: min(92vw, 620px);
      padding: 42px 28px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 28px;
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    .logo {
      font-size: clamp(64px, 18vw, 110px);
      font-weight: 900;
      letter-spacing: -8px;
      margin: 0 0 12px;
      text-shadow: 0 8px 30px rgba(0,0,0,.25);
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { opacity: .82; line-height: 1.7; }
    button {
      margin-top: 16px;
      border: 0;
      border-radius: 999px;
      padding: 13px 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: white;
      color: #1e1b4b;
    }
    button:active { transform: scale(.97); }
    #status { margin-top: 18px; min-height: 28px; }
    footer { margin-top: 28px; font-size: 13px; opacity: .55; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">XYF</div>
    <h1>我的第一个 GitHub Pages 网站</h1>
    <p>这是一个专门用来测试的网站。上传到 GitHub 后，就可以通过公开网址访问。</p>
    <button onclick="testSite()">点击测试</button>
    <div id="status"></div>
    <footer>Powered by HTML · CSS · JavaScript</footer>
  </main>

  <script>
    function testSite() {
      const now = new Date().toLocaleTimeString('zh-CN');
      document.getElementById('status').textContent =
        '✅ 网站运行正常！测试时间：' + now;
    }
  </script>
</body>
</html>
